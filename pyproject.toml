[project]
name = "llmpeg"
version = "0.1.1"
description = "Plain-English ffmpeg, powered by Gemini"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["google-genai", "rich"]

[project.urls]
Homepage = "https://github.com/ratmaster00/llmpeg"

[project.scripts]
llmpeg = "llmpeg:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["llmpeg"]
